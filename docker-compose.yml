name: paperflow

services:
  db:
    image: postgres:16-alpine
    container_name: paperflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paperflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperflow_dev}
      POSTGRES_DB: ${POSTGRES_DB:-paperflow}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Localhost-only binding: the database is never exposed beyond this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - paperflow_pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperflow} -d ${POSTGRES_DB:-paperflow}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  # Named volume keeps data across `docker compose down`. Never delete it
  # (`docker compose down -v`) unless you intend to destroy all local data.
  paperflow_pgdata:
